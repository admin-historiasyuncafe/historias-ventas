<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#008080">
<title>Historias y un Café · Ventas</title>
<script src="puente-ventas.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  --bg:#EDEDED; --surface:#FFFFFF; --surface2:#F5F5F2; --ink:#24272A; --muted:#566260; --line:rgba(36,39,42,.12);
  --teal:#008080; --gold:#A57F50; --sage:#5C857D; --mint:#9FCFCA;
  --cl:#008080; --dd:#A57F50; --cl-ink:#006666; --dd-ink:#7C5B2C;
  --track:rgba(36,39,42,.09); --glass:rgba(237,237,237,.82); --focus:#008080;
  --glow:rgba(0,128,128,.20);
  --shadow:0 1px 0 rgba(255,255,255,.8) inset,0 14px 34px -18px rgba(36,39,42,.35);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#181B1D; --surface:#24272A; --surface2:#2C3033; --ink:#EDEDED; --muted:#A8B3B1; --line:rgba(237,237,237,.13);
    --cl:#1FA9A4; --dd:#C9A06B; --cl-ink:#86D6D0; --dd-ink:#DDBB8C;
    --track:rgba(237,237,237,.11); --glass:rgba(24,27,29,.82); --focus:#9FCFCA; --glow:rgba(31,169,164,.26);
    --shadow:0 1px 0 rgba(255,255,255,.05) inset,0 14px 34px -18px rgba(0,0,0,.7);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#181B1D; --surface:#24272A; --surface2:#2C3033; --ink:#EDEDED; --muted:#A8B3B1; --line:rgba(237,237,237,.13);
  --cl:#1FA9A4; --dd:#C9A06B; --cl-ink:#86D6D0; --dd-ink:#DDBB8C;
  --track:rgba(237,237,237,.11); --glass:rgba(24,27,29,.82); --focus:#9FCFCA; --glow:rgba(31,169,164,.26);
  --shadow:0 1px 0 rgba(255,255,255,.05) inset,0 14px 34px -18px rgba(0,0,0,.7);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 150px);-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:'Raleway',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-weight:500;font-size:16px;line-height:1.45;
  font-variant-numeric:lining-nums tabular-nums;font-feature-settings:'lnum' 1,'tnum' 1;
  background-image:radial-gradient(900px 420px at 50% -120px,var(--glow),transparent 70%);
  background-repeat:no-repeat;
}
body::before{content:"";position:fixed;left:0;right:0;top:0;height:env(safe-area-inset-top,0px);background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);z-index:30}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:6px}
h1,h2,h3,p{margin:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ── Encabezado ── */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.top-in{max-width:1080px;margin:0 auto;padding:10px 16px 12px;display:grid;gap:10px}
.top-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.mark{width:38px;height:auto;display:block;flex:none}
.brand .wm{display:block;font-weight:800;font-size:12.5px;letter-spacing:.2px;color:var(--muted);line-height:1.1}
.brand h1{font-size:23px;font-weight:800;line-height:1.1;letter-spacing:-.2px}
.tools{display:flex;gap:6px}
.ibtn{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);transition:transform .12s ease,background .2s}
.ibtn:active{transform:scale(.93)}
.ibtn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ibtn.spin svg{animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.chan{position:relative;display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px;width:100%;max-width:420px;margin:0 auto}
.chan::before{content:"";position:absolute;top:4px;bottom:4px;left:4px;width:calc((100% - 8px)/3);border-radius:999px;background:var(--teal);transform:translateX(calc(var(--i,0)*100%));transition:transform .3s cubic-bezier(.3,.9,.3,1)}
.chan button{position:relative;z-index:1;padding:8px 6px;font-weight:700;font-size:14px;color:var(--muted);transition:color .2s}
.chan button[aria-checked="true"]{color:#fff}

/* ── Estructura ── */
.shell{max-width:1080px;margin:0 auto;padding:18px 16px calc(112px + env(safe-area-inset-bottom,0px))}
.demo{background:var(--dd);color:#1c1c1c;text-align:center;font-weight:700;font-size:13px;padding:7px 12px}
.cols{display:grid;gap:18px}
.col-a,.col-b{display:grid;gap:18px;align-content:start;min-width:0}
@media (min-width:900px){
  .cols{grid-template-columns:minmax(0,430px) minmax(0,1fr);gap:28px;align-items:start}
  .col-a{position:sticky;top:calc(env(safe-area-inset-top,0px) + 150px)}
}
.syncline{display:flex;align-items:center;justify-content:center;gap:8px;margin:-8px auto 16px;padding:6px 14px;border-radius:999px;font-size:13px;font-weight:600;color:var(--muted);max-width:fit-content;transition:color .2s}
.syncline.err{color:#B3402F}
:root[data-theme="dark"] .syncline.err{color:#FF9B8B}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .syncline.err{color:#FF9B8B}}
.dotspin{width:12px;height:12px;border-radius:50%;border:2px solid var(--track);border-top-color:var(--teal);animation:spin .8s linear infinite}
.loading .track{animation:pulse 1.3s ease-in-out infinite}
.skel{min-height:84px;animation:pulse 1.3s ease-in-out infinite}
@keyframes pulse{50%{opacity:.45}}
.swap{animation:swapin .22s ease both}
@keyframes swapin{from{opacity:0}to{opacity:1}}

.block{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px 18px 16px;box-shadow:var(--shadow)}
.block-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.block h2{font-size:18px;font-weight:800;letter-spacing:-.1px}
.hint{font-size:13.5px;color:var(--muted)}
.note{font-size:13.5px;color:var(--ink);background:var(--surface2);border-left:4px solid var(--dd);border-radius:6px 12px 12px 6px;padding:10px 12px}
.empty{font-size:15px;color:var(--muted);padding:6px 0}

/* ── Navegación de fechas ── */
.datenav{display:grid;grid-template-columns:48px 1fr 48px;align-items:center;gap:8px;margin-bottom:18px;max-width:560px;margin-left:auto;margin-right:auto}
.datenav .ibtn:disabled{opacity:.35;cursor:default}
.datelabel{position:relative;text-align:center;padding:4px 8px;border-radius:14px;display:block}
.datelabel .dl-main{display:block;font-size:20px;font-weight:800;letter-spacing:-.2px;line-height:1.2}
.datelabel .dl-sub{display:block;font-size:13px;color:var(--muted);font-weight:600}
.datelabel input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;border:0}

/* ── Sello ── */
.seal-wrap{display:grid;justify-items:center;gap:14px}
.seal{position:relative;width:min(100%,360px);aspect-ratio:1}
.seal::before{content:"";position:absolute;inset:8%;border-radius:50%;background:radial-gradient(circle,var(--glow),transparent 68%);filter:blur(6px)}
.seal svg{position:relative;width:100%;height:100%;display:block;overflow:visible}
.seal .ring{fill:none;stroke:var(--gold);stroke-width:1.6}
.seal .track{fill:none;stroke:var(--track);stroke-width:18}
.seal .arc{fill:none;stroke-width:18;stroke-linecap:round;transition:stroke-dasharray .9s cubic-bezier(.2,.8,.2,1),stroke-dashoffset .9s cubic-bezier(.2,.8,.2,1),opacity .3s}
.seal .arc.cl{stroke:var(--cl)} .seal .arc.dd{stroke:var(--dd)}
.seal .dot{fill:var(--teal)}
.seal text{font-family:'Raleway',system-ui,sans-serif}
.seal .t-brand{font-size:21px;font-weight:800;fill:var(--ink);letter-spacing:.4px}
.seal .t-sub{font-size:13.5px;font-weight:700;fill:var(--dd-ink);letter-spacing:1.4px}
.seal-center{position:absolute;inset:0;display:grid;place-content:center;text-align:center;padding:0 20%}
.seal-center .total{font-size:clamp(34px,11vw,50px);font-weight:800;letter-spacing:-1.2px;line-height:1}
.seal-center .total .c{font-size:.5em;font-weight:700;letter-spacing:0;color:var(--muted)}
.seal-center .cap{font-size:14px;font-weight:600;color:var(--muted);margin-top:6px}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;max-width:420px}
.lg{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;align-items:center;padding:12px 14px;border-radius:16px;background:var(--surface);border:1px solid var(--line);transition:opacity .25s}
.lg.off{opacity:.45}
.lg .sw{width:12px;height:12px;border-radius:4px;grid-row:1/3}
.lg.cl .sw{background:var(--cl)} .lg.dd .sw{background:var(--dd)}
.lg b{font-size:13.5px;font-weight:700;color:var(--muted);line-height:1.1}
.lg .v{font-size:19px;font-weight:800;letter-spacing:-.3px;line-height:1.15}
.lg .s{grid-column:2;font-size:12.5px;color:var(--muted);font-weight:600}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:0;width:100%;max-width:420px;border-top:1px solid var(--line)}
.stats div{padding:12px 4px;border-bottom:1px solid var(--line)}
.stats div:nth-child(odd){padding-right:14px;border-right:1px solid var(--line)}
.stats div:nth-child(even){padding-left:14px}
.stats .k{display:block;font-size:12.5px;color:var(--muted);font-weight:600}
.stats .v{display:block;font-size:17px;font-weight:800;letter-spacing:-.2px}
.cmp{font-size:14px;color:var(--muted);text-align:center;max-width:420px}
.cmp b{color:var(--ink)}

/* ── Listas con barras ── */
.items,.emps{list-style:none;margin:0;padding:0;display:grid;gap:14px}
.item{display:grid;grid-template-columns:26px 1fr;gap:10px;align-items:start}
.rank{font-size:13px;font-weight:800;color:var(--muted);padding-top:2px;text-align:right}
.item-top{display:flex;justify-content:space-between;gap:12px;align-items:baseline;margin-bottom:6px}
.item-name{font-weight:700;font-size:15.5px;line-height:1.25;overflow-wrap:anywhere}
.item-val{white-space:nowrap;font-size:14px;color:var(--muted);font-weight:600}
.item-sub{font-size:13px;color:var(--muted);font-weight:600;margin-top:6px}
.item-val b{color:var(--ink);font-weight:800;font-size:15.5px}
.track-bar{display:flex;gap:2px;height:10px;border-radius:6px;background:var(--track);overflow:hidden}
.seg{height:100%;width:0;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.seg.cl{background:var(--cl)} .seg.dd{background:var(--dd)}
.seg:first-child{border-radius:6px 0 0 6px}.seg:last-child{border-radius:0 6px 6px 0}
.more{display:block;margin:16px auto 0;padding:9px 18px;border-radius:12px;font-weight:700;font-size:14px;background:var(--surface2);border:1px solid var(--line)}
.toggle{display:inline-grid;grid-template-columns:1fr 1fr;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:3px}
.toggle button{padding:6px 12px;border-radius:9px;font-size:13px;font-weight:700;color:var(--muted)}
.toggle button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

/* ── Gráficas de barras verticales ── */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end;height:190px}
.wcol{display:grid;grid-template-rows:auto 1fr auto;height:100%;gap:6px;text-align:center;min-width:0}
.wcol .amt{font-size:11.5px;font-weight:700;color:var(--muted);white-space:nowrap}
.wcol .stack{display:flex;flex-direction:column-reverse;justify-content:flex-start;align-self:end;width:100%;height:100%}
.wcol .stack i{display:block;width:100%;height:0;transition:height .6s cubic-bezier(.2,.8,.2,1)}
.wcol .stack i.cl{background:var(--cl)} .wcol .stack i.dd{background:var(--dd)}
.wcol .stack i:last-child{border-radius:8px 8px 0 0}
.wcol .stack i:first-child{border-radius:0 0 4px 4px}
.wcol .stack i:only-child{border-radius:8px 8px 4px 4px}
.wcol .dlab{font-size:12px;font-weight:700;color:var(--muted)}
.wcol[aria-current="true"] .dlab,.wcol[aria-current="true"] .amt{color:var(--ink)}
.wcol:not([aria-current="true"]) .stack{opacity:.55}
.wcol:hover .stack{opacity:1}
.bars{display:grid;gap:3px;align-items:end;height:170px}
.bars .bcol{display:grid;grid-template-rows:1fr auto;height:100%;gap:5px;min-width:0}
.bars .stack{display:flex;flex-direction:column-reverse;align-self:end;width:100%;height:100%}
.bars .stack i{display:block;width:100%;height:0;transition:height .6s cubic-bezier(.2,.8,.2,1)}
.bars .stack i.cl{background:var(--cl)} .bars .stack i.dd{background:var(--dd)}
.bars .stack i:last-child{border-radius:4px 4px 0 0}
.bars .zero{align-self:end;height:3px;border-radius:2px;background:var(--track)}
.bars .zero.ns{background:none;height:0;border-bottom:3px dotted var(--muted)}
.bars .bl{font-size:10.5px;font-weight:700;color:var(--muted);height:13px;text-align:center}
.bars .bcol[aria-current="true"] .bl{color:var(--ink)}

/* ── Controles generales ── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 18px;border-radius:12px;font-weight:700;font-size:15px;background:var(--teal);color:#fff;transition:transform .12s ease,filter .2s}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.5;cursor:default}
.btn:focus-within{outline:3px solid var(--focus);outline-offset:2px}
.btn.alt{background:var(--surface2);color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:#B3402F;color:#fff}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.field{display:grid;gap:4px;font-size:13px;font-weight:700;color:var(--muted)}
.field input,.field select{font:inherit;font-weight:600;color:var(--ink);background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:9px 10px;min-height:42px}
.pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12.5px;font-weight:700;background:var(--surface2);border:1px solid var(--line)}
.pill.ok{background:rgba(0,128,128,.14);color:var(--cl-ink);border-color:transparent}
.pill.warn{background:rgba(165,127,80,.18);color:var(--dd-ink);border-color:transparent}
.list{list-style:none;margin:0;padding:0;display:grid}
.list li{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.list li:last-child{border-bottom:0}
.list .nm{overflow-wrap:anywhere;font-weight:700}
.list .sub{display:block;color:var(--muted);font-size:12.5px;font-weight:600}
.res{font-size:14px;padding:8px 0}
.res.ok{color:var(--cl-ink)} .res.err{color:#B3402F}
:root[data-theme="dark"] .res.err{color:#FF9B8B}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .res.err{color:#FF9B8B}}
code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;background:var(--surface2);padding:2px 6px;border-radius:6px}
.stack-gap{display:grid;gap:14px}
.list select{width:100%;font:inherit;font-weight:600;color:var(--ink);background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:9px 10px;min-height:44px}
.list li.eq{display:grid;gap:8px}
details{margin-top:14px;border-top:1px solid var(--line)}
details summary{cursor:pointer;font-weight:700;padding:12px 0;font-size:15px}

/* ── Pestañas inferiores ── */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav-in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.nav button{display:grid;justify-items:center;gap:2px;padding:9px 4px 8px;font-size:12px;font-weight:700;color:var(--muted);transition:color .2s}
.nav button svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;transition:transform .25s}
.nav button[aria-current="page"]{color:var(--cl-ink)}
.nav button[aria-current="page"] svg{transform:translateY(-2px) scale(1.08)}

/* ── PIN ── */
.lock{position:fixed;inset:0;z-index:50;background:var(--bg);display:grid;place-content:center;justify-items:center;gap:16px;padding:24px;text-align:center}
.lock img{width:84px}
.lock input{font:inherit;font-size:26px;font-weight:800;letter-spacing:.4em;text-align:center;width:min(260px,80vw);padding:12px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.lock .err{color:#B3402F;font-weight:700;min-height:1.4em;max-width:320px}

/* ── Aviso ── */
.toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:700;font-size:14px;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:40;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* ── Hoja de reporte ── */
.paper{background:#fff;color:#24272A;border-radius:6px;padding:28px 26px;max-width:860px;margin:0 auto;box-shadow:var(--shadow);border:1px solid var(--line);font-variant-numeric:lining-nums tabular-nums}
.paper .ph{display:flex;align-items:center;gap:16px;border-bottom:3px solid #008080;padding-bottom:14px;margin-bottom:18px}
.paper .ph img{width:64px}
.paper h2{font-size:22px;font-weight:800;margin-bottom:2px}
.paper h3{font-size:16px;font-weight:800;margin:22px 0 8px;color:#006666}
.paper .meta{font-size:13px;color:#566260}
.paper table{width:100%;border-collapse:collapse;font-size:14px}
.paper th{text-align:left;font-weight:800;border-bottom:2px solid #24272A;padding:6px 8px;font-size:13px}
.paper td{border-bottom:1px solid #dcdcd8;padding:6px 8px}
.paper .n{text-align:right;white-space:nowrap}
.paper tr.tot td{font-weight:800;border-top:2px solid #24272A;border-bottom:0}
.paper .pn{font-size:12.5px;color:#566260;margin-top:10px}
.tw{overflow-x:auto}
.ctl{display:grid;gap:14px;max-width:860px;margin:0 auto 18px}

@media (max-width:600px){
  .paper{padding:20px 14px}
  .paper table{font-size:13px}
  .paper table.w{min-width:430px}
  .paper td,.paper th{padding:6px 5px}
  .paper td:first-child{min-width:130px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
@media print{
  body{background:#fff;background-image:none}
  body::before,.top,.nav,.noprint,.toast,.demo{display:none!important}
  :root{padding:0}
  .shell{max-width:none;padding:0}
  .paper{box-shadow:none;border:0;padding:0;max-width:none}
  .swap{animation:none}
}
</style>
</head>
<body>

<div id="demoBar" class="demo" hidden>Demostración con datos de ejemplo. Los números no son reales.</div>

<header class="top noprint">
  <div class="top-in">
    <div class="top-row">
      <div class="brand">
        <img class="mark" alt="" data-mark>
        <div><span class="wm">historias y un café</span><h1>Ventas</h1></div>
      </div>
      <div class="tools">
        <button class="ibtn" id="btnTheme" aria-label="Cambiar entre modo claro y oscuro" title="Modo claro u oscuro">
          <svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/></svg>
        </button>
        <button class="ibtn" id="btnLock" aria-label="Bloquear" title="Bloquear">

<script>
(function(){
'use strict';

/* ═════════ Utilidades de fecha y formato ═════════ */
const MESES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const DIAS=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const DIAS3=['dom','lun','mar','mié','jue','vie','sáb'];
const parse=d=>{const[p,q,r]=d.split('-').map(Number);return new Date(Date.UTC(p,q-1,r));};
const fmt=dt=>dt.toISOString().slice(0,10);
const add=(d,n)=>{const x=parse(d);x.setUTCDate(x.getUTCDate()+n);return fmt(x);};
const monthKey=d=>d.slice(0,7);
const monthStart=m=>m+'-01';
const monthEnd=m=>{const[y,mo]=m.split('-').map(Number);return fmt(new Date(Date.UTC(y,mo,0)));};
const addMonths=(m,n)=>{const[y,mo]=m.split('-').map(Number);return fmt(new Date(Date.UTC(y,mo-1+n,1))).slice(0,7);};
const labelDay=d=>{const x=parse(d);return DIAS[x.getUTCDay()]+' '+x.getUTCDate()+' de '+MESES[x.getUTCMonth()];};
const labelMonth=m=>{const[y,mo]=m.split('-').map(Number);return MESES[mo-1]+' '+y;};
const monthName=m=>MESES[Number(m.split('-')[1])-1];
const nf=new Intl.NumberFormat('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const nf0=new Intl.NumberFormat('en-US',{maximumFractionDigits:0});
const money=n=>'$'+nf.format(n);
const money0=n=>'$'+nf0.format(n);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=id=>document.getElementById(id);
const reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ═════════ Nombres de platos ═════════ */
const norm=s=>String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'');
const cleanDD=s=>String(s).split(/\s*\/\s*/)[0].replace(/\s+/g,' ').replace(/[.\s]+$/,'').trim();
/* Emparejamiento automático DoorDash <-> Clover */
const STOP=new Set(['de','del','la','el','los','las','con','y','o','en','al','a','un','una','sin','the','of','and','with','or','house']);
const SYN={chicken:'pollo',avocado:'aguacate',juice:'jugo',orange:'china',passion:'parcha',coffee:'cafe',eggs:'huevo',egg:'huevo',huevos:'huevo',french:'francesa',francesas:'francesa',toast:'tostada',toasts:'tostada',tostadas:'tostada',panqueques:'pancake',panqueque:'pancake',pancakes:'pancake',pumpkin:'calabaza',bacon:'tocineta',cheese:'queso',ham:'jamon',turkey:'pavo',fries:'papa',papas:'papa',potatoes:'papa',fruits:'fruta',fruit:'fruta',frutas:'fruta',sandwiches:'sandwich',wraps:'wrap',breakfast:'desayuno',vegetables:'vegetal',vegetales:'vegetal',tuna:'atun',omelet:'omelette',waffles:'waffle',water:'agua',sparkling:'gas',iced:'helado',mayonesa:'mayo',picante:'spicy',scrambled:'revuelto',revoltillo:'revuelto',revueltos:'revuelto',fresh:'fresco',kids:'kid',natural:'natural'};
function toks(s){
  let t=String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
  t=t.replace(/(\d+)\s*[o0]z\.?/g,'$1oz');
  const out=[];
  t.replace(/[^a-z0-9]+/g,' ').trim().split(' ').filter(Boolean).forEach(w=>{
    if(STOP.has(w))return;
    w=SYN[w]||w;
    if(w.length>3&&w.endsWith('s')&&!/\d/.test(w))w=w.slice(0,-1);
    out.push(w);
  });
  return [...new Set(out)];
}
function simScore(a,b){
  if(!a.length||!b.length)return 0;
  const na=a.filter(x=>/\d/.test(x)),nb=b.filter(x=>/\d/.test(x));
  if(na.length&&nb.length&&!na.some(x=>nb.includes(x)))return 0; // tamaños distintos: no son el mismo plato
  const sb=new Set(b),inter=a.filter(x=>sb.has(x)).length;
  if(!inter)return 0;
  return 0.75*(2*inter/(a.length+b.length))+0.25*(inter/Math.min(a.length,b.length));
}
const AUTO_MIN=0.8,AUTO_GAP=0.1,SUGG_MIN=0.6;
function buildMatch(){
  const D=state.data;if(!D)return;
  const clToks=new Map();D.clItems.forEach(r=>{if(!clToks.has(r[1]))clToks.set(r[1],toks(r[1]));});
  const clNames=[...clToks.keys()],clNorm=new Set(clNames.map(norm));
  const ddNames=[...new Set(D.ddItems.map(r=>cleanDD(r[2])))];
  const M={auto:new Map(),sugg:new Map(),solo:[],exact:0,done:[],clNames};
  ddNames.forEach(n=>{
    if(D.equiv[n]){M.done.push(n);return;}
    if(clNorm.has(norm(n))){M.exact++;return;}
    const t=toks(n);
    const sc=clNames.map(c=>[c,simScore(t,clToks.get(c))]).filter(x=>x[1]>0).sort((p,q)=>q[1]-p[1]);
    const s1=sc[0]?sc[0][1]:0,s2=sc[1]?sc[1][1]:0;
    if(s1>=AUTO_MIN&&s1-s2>=AUTO_GAP)M.auto.set(n,sc[0][0]);
    else if(s1>=SUGG_MIN)M.sugg.set(n,{c:sc[0][0],s:s1});
    else M.solo.push(n);
  });
  M.solo.sort((a,b)=>a.localeCompare(b,'es'));
  state.match=M;
}

function call(fn,...args){

    if(HAS_GAS){google.script.run.withSuccessHandler(res).withFailureHandler(rej)[fn](...args);}

const store={get:k=>{try{return localStorage.getItem(k);}catch(e){return null;}},set:(k,v)=>{try{localStorage.setItem(k,v);}catch(e){}},del:k=>{try{localStorage.removeItem(k);}catch(e){}}};
const state={view:'dia',ch:'all',day:null,month:null,sort:'q',maxItems:8,data:null,pin:'',
  rep:{mode:'mes',month:null,from:null,to:null},imports:null,uploadMsgs:[],busy:false,

const useCl=()=>state.ch!=='dd';

/* ═════════ Agregación ═════════ */
function agg(from,to){
  const D=state.data;
  const r={cl:{b:0,o:0},dd:{b:0,o:0},ddPendV:0,ddPendI:0,ddUnspread:0,days:{},items:new Map(),emp:new Map(),ddItemsIn:false,ddItemsGross:0,ddFromItems:false,synced:{}};
  for(let d=from;d<=to;d=add(d,1))r.days[d]={cl:0,dd:0};
  if(!D)return r;
  D.clDias.forEach(([d,o,b])=>{if(d>=from&&d<=to){r.cl.b+=b;r.cl.o+=o;r.days[d].cl+=b;r.synced[d]=true;}});
  const getItem=(key,name)=>{let x=r.items.get(key);if(!x){x={name,cl:{q:0,b:0},dd:{q:0,b:0}};r.items.set(key,x);}return x;};
  D.clItems.forEach(([d,n,q,b])=>{if(d>=from&&d<=to){const x=getItem(norm(n),n);x.name=n;x.cl.q+=q;x.cl.b+=b;}});
  D.clEmp.forEach(([d,n,o,b])=>{if(d>=from&&d<=to){let x=r.emp.get(n);if(!x){x={name:n,o:0,b:0};r.emp.set(n,x);}x.o+=o;x.b+=b;}});
  D.ddVentas.forEach(([s,e,o,c,b])=>{
    if(s>=from&&e<=to){r.dd.b+=b;r.dd.o+=o;if(s===e)r.days[s].dd+=b;else r.ddUnspread+=b;}
    else if(s<=to&&e>=from){r.ddPendV+=b;}
  });
  D.ddItems.forEach(([s,e,n,q,b])=>{
    if(s>=from&&e<=to){
      const nm=cleanDD(n),uni=D.equiv[nm]||(state.match&&state.match.auto.get(nm))||nm,key=norm(uni);
      const x=getItem(key,uni);x.dd.q+=q;x.dd.b+=b;r.ddItemsIn=true;r.ddItemsGross+=b;
    }else if(s<=to&&e>=from){r.ddPendI+=b;}
  });
  if(r.dd.b===0&&r.ddItemsGross>0){r.dd.b=r.ddItemsGross;r.ddFromItems=true;}
  return r;
}
const chTotal=a=>(useCl()?a.cl.b:0)+(useDd()?a.dd.b:0);
const chOrders=a=>(useCl()?a.cl.o:0)+(useDd()?a.dd.o:0);
function itemRows(a){
  const arr=[];
  a.items.forEach(x=>{
    const cl=useCl()?x.cl:{q:0,b:0},dd=useDd()?x.dd:{q:0,b:0};
    const q=cl.q+dd.q,b=cl.b+dd.b;
    if(q>0||b>0)arr.push({name:x.name,cl,dd,q,b});
  });
  arr.sort((p,q)=>state.sort==='q'?(q.q-p.q||q.b-p.b):(q.b-p.b||q.q-p.q));
  return arr;
}
function notesFor(a,scope){
  const out=[];
  if(useDd()){
    if(a.ddFromItems)out.push('DoorDash: el total sale de sumar los platos del reporte de platos. Sube el reporte de ventas diarias de este período para ver órdenes, ticket y ventas por día.');
    if(a.ddPendV>0)out.push(`DoorDash: ${money(a.ddPendV)} vienen dentro de un reporte de ventas que cruza ${scope} y no se pueden asignar. Vuelve a pedir el reporte con granularidad diaria.`);
    if(a.ddUnspread>0)out.push(`DoorDash: ${money(a.ddUnspread)} vienen en reportes de varios días. Cuentan en el total, pero no aparecen en las barras por día.`);
    if(a.ddPendI>0)out.push(`Platos de DoorDash: ${money(a.ddPendI)} vienen en un reporte de platos que cruza ${scope} y no se cuentan en el ranking. Pídelo por mes calendario o por día.`);
  }
  return out;
}

function setArc(el,start,len){
  if(len<=0.4){el.style.opacity='0';el.setAttribute('stroke-dasharray','0 '+C);return;}
  el.style.opacity='1';
  el.setAttribute('stroke-dasharray',len.toFixed(2)+' '+C.toFixed(2));
  el.setAttribute('stroke-dashoffset',(-start).toFixed(2));
}
function sealSet(cl,dd,label,cap){
  const tot=cl+dd;
  $('sealLabel').textContent=label;
  $('sealCap').textContent=cap;
  const A=$('arcCl'),B=$('arcDd');
  if(tot<=0){setArc(A,0,0);setArc(B,0,0);}
  else if(cl>0&&dd>0){
    const fa=cl/tot,pad=CAP+GAP;
    setArc(A,pad,Math.max(0.5,fa*C-2*pad));
    setArc(B,fa*C+pad,Math.max(0.5,(1-fa)*C-2*pad));
  }else if(cl>0){setArc(A,0,C);setArc(B,0,0);}
  else{setArc(A,0,0);setArc(B,0,C);}
  animTotal($('sealTotal'),tot);
}
function totalHTML(v,cents){
  if(!cents)return '$'+nf0.format(Math.round(v));
  const s=nf.format(v),i=s.lastIndexOf('.');
  return '$'+s.slice(0,i)+'<span class="c">'+s.slice(i)+'</span>';
}
function animTotal(el,to){
  const from=el._v||0;el._v=to;
  cancelAnimationFrame(el._raf);
  // sin centavos desde $10,000 y letra ajustada para que quepa dentro del aro
  const cents=to<10000;
  const sealEl=$('seal'),W=(sealEl&&sealEl.getBoundingClientRect().width)||300;
  const units=('$'+nf0.format(Math.floor(to))).length*0.52+(cents?0.9:0);
  el.style.fontSize=Math.max(22,Math.min(52,0.5*W/units)).toFixed(1)+'px';
  if(reduce||from===to){el.innerHTML=totalHTML(to,cents);return;}
  const t0=performance.now(),dur=900;
  const step=t=>{
    const k=Math.min(1,(t-t0)/dur),e=1-Math.pow(1-k,3);
    el.innerHTML=totalHTML(from+(to-from)*e,cents);
    if(k<1)el._raf=requestAnimationFrame(step);
  };
  el._raf=requestAnimationFrame(step);
}
function legendHTML(a){
  const mk=(cls,name,b,o,on,alt)=>`<div class="lg ${cls}${on?'':' off'}"><span class="sw"></span><b>${name}</b><span class="v">${money(b)}</span>${alt?`<span class="s">${alt[0]}</span><span class="s">${alt[1]}</span>`:`<span class="s">${o} ${o===1?'orden':'órdenes'}</span><span class="s">${o>0?'ticket '+money(b/o):'sin ventas'}</span>`}</div>`;
  return mk('cl','Clover',a.cl.b,a.cl.o,useCl())+mk('dd','DoorDash',a.dd.b,a.dd.o,useDd(),a.ddFromItems?['suma de platos','sin dato de órdenes']:null);
}
function growBars(root){
  root.querySelectorAll('[data-w]').forEach(el=>{el.style.width='0%';});
  root.querySelectorAll('[data-h]').forEach(el=>{el.style.height='0%';});
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    root.querySelectorAll('[data-w]').forEach(el=>{el.style.width=el.dataset.w;});
    root.querySelectorAll('[data-h]').forEach(el=>{el.style.height=el.dataset.h;});
  }));
}
function itemsHTML(rows,max){
  if(!rows.length)return '';
  const key=state.sort==='q'?'q':'b';
  const top=Math.max(...rows.map(r=>r[key]),0.0001);
  return rows.slice(0,max).map((r,i)=>{
    const wc=(state.sort==='q'?r.cl.q:r.cl.b)/top*100,wd=(state.sort==='q'?r.dd.q:r.dd.b)/top*100;
    return `<li class="item"><span class="rank">${i+1}</span><div><div class="item-top"><span class="item-name">${esc(r.name)}</span><span class="item-val"><b>${r.q}</b> ${money(r.b)}</span></div>
      <div class="track-bar" role="img" aria-label="${esc(r.name)}: ${r.q} vendidos, Clover ${r.cl.q}, DoorDash ${r.dd.q}">${wc>0?`<span class="seg cl" data-w="${wc.toFixed(2)}%"></span>`:''}${wd>0?`<span class="seg dd" data-w="${wd.toFixed(2)}%"></span>`:''}</div></div></li>`;
  }).join('');
}
function empHTML(a){
  const rows=[...a.emp.values()].sort((p,q)=>q.b-p.b);
  if(!rows.length)return '';
  const top=Math.max(...rows.map(r=>r.b),0.0001);
  return rows.map((r,i)=>`<li class="item"><span class="rank">${i+1}</span><div><div class="item-top"><span class="item-name">${esc(r.name)}</span><span class="item-val"><b>${money(r.b)}</b></span></div>
    <div class="track-bar"><span class="seg cl" data-w="${(r.b/top*100).toFixed(2)}%"></span></div>
    <div class="item-sub">${r.o} ${r.o===1?'orden':'órdenes'} · ticket promedio ${money(r.o?r.b/r.o:0)}</div></div></li>`).join('');
}
function chartCols(days,keys,max){
  return keys.map(k=>{
    const v=days[k],c=useCl()?v.cl:0,d=useDd()?v.dd:0;
    return {k,c,d,hc:max?c/max*100:0,hd:max?d/max*100:0,t:c+d};
  });

/* ═════════ Actualizar Clover al abrir Día o Mes ═════════ */
const SYNC_EVERY=60000; // no más de una consulta a Clover por minuto
function viewingToday(){
  const D=state.data;if(!D)return false;
  return (state.view==='dia'&&state.day===D.today)||(state.view==='mes'&&state.month===monthKey(D.today));
}
function renderSyncLine(){
  const el=$('syncLine');if(!el)return;
  const D=state.data;
  if(!D||!D.cloverOk||!viewingToday()){el.hidden=true;return;}
  el.hidden=false;el.className='syncline';
  if(state.sync.busy){el.innerHTML='<span class="dotspin"></span>Actualizando Clover…';return;}
  if(state.sync.err){el.className='syncline err';el.textContent='No se pudo actualizar Clover. Toca para reintentar.';return;}
  const last=D.lastSync?new Date(D.lastSync).getTime():0;
  const m=last?Math.max(0,Math.round((Date.now()-last)/60000)):null;
  el.textContent=m===null?'Clover sin actualizar. Toca para actualizar.':m<1?'Clover actualizado hace un momento':m<60?'Clover actualizado hace '+m+' min':'Clover actualizado hace '+Math.round(m/60)+' h';
}
async function syncToday(force){
  const D=state.data;
  if(!D||!D.cloverOk||state.sync.busy)return;
  if(!force&&Date.now()-state.sync.last<SYNC_EVERY)return;
  state.sync.busy=true;state.sync.last=Date.now();state.sync.err='';renderSyncLine();
  $('btnReload').classList.add('spin');
  try{
    const nd=await call('syncHoy',state.pin);
    if(nd.syncError)state.sync.err=nd.syncError;
    state.data=mergeRecent(nd);initState();
  }catch(e){
    const m=errMsg(e);
    if(/PIN_/.test(m)){lockApp(pinMsg(m));}
    else state.sync.err=m;
  }
  state.sync.busy=false;
  $('btnReload').classList.remove('spin');
  refresh();
}
function maybeSync(){if(viewingToday())syncToday(false);}

  <p class="pn">Ventas brutas: suma de los platos vendidos, sin impuesto ni propina. Clover descuenta reembolsos. DoorDash viene de los reportes subidos.${notes.length?'<br>'+notes.map(esc).join('<br>'):''}</p></div>`;
  // CSV
  const q=v=>'"'+String(v).replace(/"/g,'""')+'"';
  const L=[];
  L.push([q('Reporte de ventas'),q(label)].join(','));
  L.push('');L.push(['Canal','Órdenes','Ventas brutas'].map(q).join(','));
  L.push([q('Clover'),a.cl.o,a.cl.b.toFixed(2)].join(','));L.push([q('DoorDash'),a.dd.o,a.dd.b.toFixed(2)].join(','));L.push([q('Total'),ord,tot.toFixed(2)].join(','));
  L.push('');L.push(['Fecha','Clover','DoorDash','Total'].map(q).join(','));
  days.forEach(k=>L.push([k,a.days[k].cl.toFixed(2),a.days[k].dd.toFixed(2),(a.days[k].cl+a.days[k].dd).toFixed(2)].join(',')));
  L.push('');L.push(['Plato','Cantidad Clover','Cantidad DoorDash','Cantidad total','Ventas'].map(q).join(','));
  items.forEach(x=>L.push([q(x.name),x.cq,x.dq,x.q,x.b.toFixed(2)].join(',')));
  L.push('');L.push(['Vendedor (Clover)','Órdenes','Ventas brutas','Ticket promedio'].map(q).join(','));

  return {html,csv:'\uFEFF'+L.join('\r\n'),name:'ventas_'+from+'_'+to+'.csv'};
}

/* ═════════ Navegación y eventos ═════════ */
function setView(v){
  state.view=v;
  document.querySelectorAll('.nav button').forEach(b=>{if(b.dataset.view===v)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');});
  $('chan').style.display=(v==='dia'||v==='mes')?'':'none';
  window.scrollTo(0,0);
  state.maxItems=8;
  if(v==='dia')mountDia();else if(v==='mes')mountMes();
  refresh();
}
function refresh(){
  if(!state.data){
    $('main').innerHTML=`<section class="swap loading"><div class="seal-wrap">${sealHTML()}<div class="legend"><div class="lg skel"></div><div class="lg skel"></div></div></div>
      <div class="cols" style="margin-top:18px"><div class="col-a"><section class="block skel"></section></div><div class="col-b"><section class="block skel"></section></div></div></section>`;
    $('sealTotal').innerHTML='';$('sealLabel').textContent='';$('sealCap').textContent='Cargando…';
    return;
  }
  if(state.view==='dia'){if(!$('v-dia'))mountDia();updateDia();}
  else if(state.view==='mes'){if(!$('v-mes'))mountMes();updateMes();}
  else if(state.view==='reporte')renderReporte();
  else renderAjustes();
}
function setChannel(ch){
  state.ch=ch;
  const i={all:0,cl:1,dd:2}[ch];
  $('chan').style.setProperty('--i',i);
  document.querySelectorAll('#chan button').forEach(b=>b.setAttribute('aria-checked',String(b.dataset.ch===ch)));
  refresh();
}
function toast(msg){const t=$('toast');t.textContent=msg;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),3200);}
function errMsg(e){const m=String((e&&e.message)||e||'Error');return m.replace(/^Error:\s*/,'');}

const actions={
  resync(){syncToday(true);},
  prev(){state.day=add(state.day,-1);updateDia();},
  next(){if(state.day<state.data.today){state.day=add(state.day,1);updateDia();}},
  mprev(){state.month=addMonths(state.month,-1);updateMes();},
  mnext(){if(state.month<monthKey(state.data.today)){state.month=addMonths(state.month,1);updateMes();}},
  openDay(t){state.day=t.dataset.d;setView('dia');},
  sort(t){state.sort=t.dataset.s;refresh();},
  more(){state.maxItems=state.maxItems>8?8:23;refresh();},
  repmode(t){state.rep.mode=t.dataset.m;renderReporte();},
  print(){window.print();},
  csv(){
    const r=state.lastReport;if(!r)return;
    try{const b=new Blob([r.csv],{type:'text/csv;charset=utf-8'});const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download=r.name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);toast('CSV descargado');}
    catch(e){toast('No se pudo descargar. Prueba desde un navegador de escritorio.');}
  },
  theme(t){store.set(LS.theme,t.dataset.t);applyTheme();renderAjustes();},
  async sync(t){
    t.disabled=true;t.textContent='Actualizando…';
    try{await call('syncNow',state.pin);await loadData(true);toast('Clover actualizado');}
    catch(e){toast(errMsg(e));}
    if(state.view==='ajustes')renderAjustes();
  },
  async hist(t){
    const f=$('hFrom').value,h=$('hTo').value;
    if(!f||!h){toast('Elige las dos fechas.');return;}
    t.disabled=true;t.textContent='Trayendo…';
    try{const r=await call('syncRango',state.pin,f,h);await loadData(true);toast('Historial listo: '+r.dias+' días');}
    catch(e){toast(errMsg(e));}
    if(state.view==='ajustes')renderAjustes();
  },
  async acceptAll(t){
    const pares=[...state.match.sugg.entries()].map(([dd,x])=>[dd,x.c]);
    if(!pares.length)return;
    t.disabled=true;t.textContent='Guardando…';
    try{await call('guardarEquivVarios',state.pin,pares);pares.forEach(([d,u])=>{state.data.equiv[d]=u;});buildMatch();toast(pares.length+' platos emparejados');}
    catch(e){toast(errMsg(e));}
    renderAjustes();
  },
  async undoAuto(t){
    const dd=t.dataset.dd;
    try{await call('guardarEquiv',state.pin,dd,dd);state.data.equiv[dd]=dd;buildMatch();toast('Plato separado');}
    catch(e){toast(errMsg(e));}
    renderAjustes();
  },
  async del(t){
    if(t.dataset.armed!=='1'){t.dataset.armed='1';t.textContent='¿Seguro? Quitar';t.classList.remove('alt');t.classList.add('danger');setTimeout(()=>{if(t.isConnected){t.dataset.armed='';t.textContent='Quitar';t.classList.add('alt');t.classList.remove('danger');}},4000);return;}
    try{await call('borrarImportacion',state.pin,t.dataset.t,t.dataset.f);state.imports=null;await loadData(true);toast('Reporte quitado');}
    catch(e){toast(errMsg(e));}
    renderAjustes();
  }
};
const changes={

  repFrom(t){if(t.value){state.rep.from=t.value;renderReporte();}},

};

// deslizar para cambiar de día o mes
(function(){let x0=0,y0=0;
  $('main').addEventListener('touchstart',e=>{x0=e.touches[0].clientX;y0=e.touches[0].clientY;},{passive:true});
  $('main').addEventListener('touchend',e=>{
    const dx=e.changedTouches[0].clientX-x0,dy=e.changedTouches[0].clientY-y0;

async function handleFiles(files){
  state.uploadMsgs=[];
  const list=[...files];
  for(const f of list){
    try{const text=await f.text();const r=await call('importarDoorDash',state.pin,f.name,text);state.uploadMsgs.push({file:f.name,ok:!!r.ok,msg:r.msg||''});}
    catch(e){state.uploadMsgs.push({file:f.name,ok:false,msg:errMsg(e)});}
  }
  state.imports=null;
  await loadData(true);
  renderAjustes();
}

/* ═════════ Tema ═════════ */
function applyTheme(){
  const t=store.get(LS.theme)||'auto';
  if(t==='auto')delete document.documentElement.dataset.theme;else document.documentElement.dataset.theme=t;
}

/* ═════════ Carga de datos ═════════ */
function initState(){
  const D=state.data;
  if(!state.day||state.day>D.today)state.day=D.today;
  if(!state.month)state.month=monthKey(D.today);
  buildMatch();
}
const olderPending=d=>!state.olderLoaded&&!!state.data&&d<state.data.recentFrom;
// conserva el historial antiguo ya cargado cuando llegan datos recientes nuevos
function mergeRecent(nd){
  const old=state.data;
  if(old&&state.olderLoaded){
    ['clDias','clItems','clEmp'].forEach(k=>{nd[k]=old[k].filter(r=>r[0]<nd.recentFrom).concat(nd[k]);});
  }
  return nd;
}
// el resto del historial llega en segundo plano, después de que la pantalla ya abrió
async function loadOlder(){
  if(state.olderLoaded||state.loadingOlder||!state.pin)return;
  state.loadingOlder=true;
  const pin=state.pin;
  try{
    const od=await call('getData',pin,'older');
    if(state.data&&state.pin===pin){
      const D=state.data;
      D.clDias=od.clDias.concat(D.clDias);D.clItems=od.clItems.concat(D.clItems);D.clEmp=od.clEmp.concat(D.clEmp);
      state.olderLoaded=true;buildMatch();refresh();
    }
  }catch(e){/* se reintenta en la próxima actualización */}
  finally{state.loadingOlder=false;}
}
async function loadData(silent){
  const btn=$('btnReload');if(!silent)btn.classList.add('spin');
  try{
    const D=await call('getData',state.pin,'recent');
    state.data=mergeRecent(D);initState();
    $('lock').hidden=true;
    refresh();
    loadOlder();
  }catch(e){
    const m=errMsg(e);
    if(/PIN_/.test(m))lockApp(pinMsg(m));
    else toast(m.length>120?'No se pudo cargar. Revisa la conexión e intenta de nuevo.':m);
  }finally{btn.classList.remove('spin');}
}
function pinMsg(m){
  if(m.indexOf('PIN_BLOQUEADO')>=0)return 'Demasiados intentos. Espera 10 minutos.';
  if(m.indexOf('PIN_NO_CONFIGURADO')>=0)return 'Falta configurar APP_PIN (6 dígitos) en las propiedades del script de Apps Script.';
  return 'PIN incorrecto.';
}
function showLock(msg){
  $('lock').hidden=false;$('pinErr').textContent=msg||'';$('pinInput').value='';
  $('pinDemo').hidden=HAS_GAS;
  setTimeout(()=>$('pinInput').focus(),50);
}
// Borra el PIN y los datos de la memoria y vuelve a pedir el PIN
function lockApp(msg){
  state.pin='';state.data=null;state.imports=null;state.uploadMsgs=[];state.olderLoaded=false;state.loadingOlder=false;
  state.sync={busy:false,last:0,err:''};
  $('main').innerHTML='';
  showLock(msg||'');
}
function tryPin(){
  const v=$('pinInput').value.replace(/\D/g,'');
  if(v.length!==6){$('pinErr').textContent='El PIN tiene 6 dígitos.';return;}
  state.pin=v;$('pinErr').textContent='';$('pinInput').value='';
  $('lock').hidden=true;refresh();   // abre la pantalla al instante; si el PIN falla, vuelve a pedirlo
  loadData(false);
}
$('pinGo').addEventListener('click',tryPin);
$('pinInput').addEventListener('input',e=>{
  e.target.value=e.target.value.replace(/\D/g,'').slice(0,6);
  if(e.target.value.length===6)tryPin();
});
$('pinInput').addEventListener('keydown',e=>{if(e.key==='Enter')tryPin();});
$('btnLock').addEventListener('click',()=>lockApp(''));

/* ═════════ Demostración (sin Apps Script) ═════════ */
const demo=(function(){
  let seed=11;const rnd=()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};
  const today=fmt(new Date(Date.now()-4*3600000));
  const menu=[['Latte 12oz',3.99,14],['Café Latte 8oz',3.30,11],['Chicken Waffle',18,6],['Blueberries Lemon Pancakes',14,8],['Avocado Ranch Chicken Wrap',13,6],['Desayuno completo',12,7],['Tostadas de aguacate',18,5],['Joe\'s Burger',19,4],['Waffle Sandwich',19,4],['Romerito',12,6],['Tostadas francesas',14,6],['Chai latte 12oz',4.90,5],['Croissant almendrado',4.50,6],['Jugo natural 16oz',5,4],['Mimosa',8,3]];
  const emps=['Vendedora A','Vendedora B','Vendedora C'];
  const wsum=menu.reduce((s,m)=>s+m[2],0);
  const pick=()=>{let r=rnd()*wsum;for(const m of menu){r-=m[2];if(r<=0)return m;}return menu[0];};
  const clDias=[],clItems=[],clEmp=[],ddVentas=[];
  for(let i=125;i>=0;i--){
    const d=add(today,-i),dw=parse(d).getUTCDay();
    if(dw===1){clDias.push([d,0,0]);continue;}
    const wk=dw===0||dw===6;
    const n=Math.round((wk?105:68)+rnd()*28*(i===0?.4:1)*(i===0?.5:1));
    const items={},em={};let tot=0;
    for(let k=0;k<n;k++){
      const lines=1+Math.floor(rnd()*3);let ob=0;
      for(let l=0;l<lines;l++){const m=pick();const it=items[m[0]]||(items[m[0]]={q:0,b:0});it.q++;it.b+=m[1];ob+=m[1];}
      const e=emps[Math.floor(rnd()*3)];const x=em[e]||(em[e]={o:0,b:0});x.o++;x.b+=ob;tot+=ob;
    }
    clDias.push([d,n,+tot.toFixed(2)]);
    Object.keys(items).forEach(k=>clItems.push([d,k,items[k].q,+items[k].b.toFixed(2)]));
    Object.keys(em).forEach(k=>clEmp.push([d,k,em[k].o,+em[k].b.toFixed(2)]));
    const dn=Math.round((wk?12:7)+rnd()*6);
    ddVentas.push([d,d,dn,0,+(dn*(24+rnd()*10)).toFixed(2)]);
  }
  const ddNames=[['Latte 12oz',14],['Wrap de Pollo con Salsa Avocado Ranch / Avocado Chicken Wrap',9],['Blueberries Lemon Pancakes',8],['Chicken Waffle',7],['Tostadas Francesas / French Toasts',6],['El Junte Sandwich o Wrap',6],['Waffle Sandwich',5],['Desayuno con Vegetales / Breakfast with Vegetables',5],['Latte Chai 12 Oz / Chai Latte 12 Oz',4],['Sandwich de pollo con aguacate',4]];
  const px={'Latte 12oz':3.99,'Chicken Waffle':18,'Blueberries Lemon Pancakes':14};
  const ddItems=[];
  const periods=[[addMonths(monthKey(today),-3)],[addMonths(monthKey(today),-2)],[addMonths(monthKey(today),-1)]].map(([m])=>[monthStart(m),monthEnd(m),30]);
  periods.push([monthStart(monthKey(today)),add(today,-1),Math.max(1,Number(today.slice(8))-1)]);
  periods.forEach(([s,e,days])=>{if(s>e)return;ddNames.forEach(([n,w])=>{const q=Math.max(1,Math.round(w*days/4*(.8+rnd()*.4)));ddItems.push([s,e,n,q,+(q*(px[n]||13.5)).toFixed(2)]);});});
  const equiv={};
  const imports=[{tipo:'ventas',archivo:'SALES_BY_TIME_demo.csv',rIni:periods[0][0],rFin:today,filas:ddVentas.length,importado:''},{tipo:'items',archivo:'PRODUCT_MIX_demo.csv',rIni:periods[0][0],rFin:today,filas:ddItems.length,importado:''}];
  if(location.search.indexOf('nosales')>=0)ddVentas.length=0;
  if(location.search.indexOf('big')>=0)clDias.forEach(r=>{r[2]=+(r[2]*9).toFixed(2);});
  const data={today,cloverOk:true,lastSync:new Date().toISOString(),clDias,clItems,clEmp,ddVentas,ddItems,equiv};
  const recentFrom=(()=>{let y=+today.slice(0,4),m=+today.slice(5,7)-1;if(m<1){m=12;y--;}return y+'-'+String(m).padStart(2,'0')+'-01';})();
  const pack=scope=>{
    const c=JSON.parse(JSON.stringify(data));
    const keep=scope==='older'?(r=>r[0]<recentFrom):(r=>r[0]>=recentFrom);
    c.clDias=c.clDias.filter(keep);c.clItems=c.clItems.filter(keep);c.clEmp=c.clEmp.filter(keep);c.recentFrom=recentFrom;
    if(scope==='older')return {scope:'older',recentFrom,clDias:c.clDias,clItems:c.clItems,clEmp:c.clEmp};
    return c;
  };
  return {
    needsPin:()=>true,
    getData:(pin,scope)=>new Promise((res,rej)=>setTimeout(()=>{
      if(pin!=='123456'){rej(new Error('PIN_INCORRECTO'));return;}
      res(pack(scope==='older'?'older':'recent'));
    },scope==='older'?1500:400)),
    syncNow:()=>({ok:true}),
    syncHoy:(pin)=>new Promise((r,j)=>setTimeout(()=>{if(pin!=='123456')j(new Error('PIN_INCORRECTO'));else r(Object.assign(pack('recent'),{lastSync:new Date().toISOString()}));},1800)),
    syncRango:(p,f,t)=>({ok:true,dias:5}),
    importarDoorDash:()=>({ok:false,msg:'No disponible en la demostración.'}),
    listarImportaciones:()=>imports,
    borrarImportacion:()=>({ok:true}),
    guardarEquiv:(p,dd,u)=>{data.equiv[dd]=u;return {ok:true};},
    guardarEquivVarios:(p,pares)=>{pares.forEach(([d,u])=>{data.equiv[d]=u;});return {ok:true};}
  };
})();

/* ═════════ Arranque ═════════ */
async function boot(){
  document.querySelectorAll('img[data-mark]').forEach(i=>{i.src=MARK_SRC;});
  OLD_KEYS.forEach(k=>store.del(k)); // limpia PIN y datos que dejaron versiones anteriores
  applyTheme();
  if(!HAS_GAS)$('demoBar').hidden=false;
  setChannel('all');
  document.querySelectorAll('.nav button').forEach(b=>{if(b.dataset.view==='dia')b.setAttribute('aria-current','page');});
  state.view='dia';
  lockApp('');
  call('needsPin').catch(()=>{});   // despierta el servidor mientras se escribe el PIN
  setInterval(()=>{
    if(document.hidden||!state.pin)return;
    if(state.view==='dia'||state.view==='mes')syncToday(true);else if(state.view!=='ajustes')loadData(true);
  },300000);
  setInterval(renderSyncLine,30000);
  let hiddenAt=0;
  document.addEventListener('visibilitychange',()=>{
    if(document.hidden){hiddenAt=Date.now();return;}
    if(state.pin&&hiddenAt&&Date.now()-hiddenAt>AUTO_LOCK_MS){lockApp('');return;}
    maybeSync();
  });
}
boot();
})();
